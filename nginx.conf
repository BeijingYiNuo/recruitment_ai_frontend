# HTTPS 服务
server {
    listen 443 ssl;
    server_name yinuoai.cloud www.yinuoai.cloud;

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types application/json text/plain text/css text/javascript;
    gzip_min_length 1000;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://172.17.0.3:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Cache-Control;
        proxy_pass_header ETag;
        proxy_pass_header Last-Modified;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    client_max_body_size 50m;
}

# HTTP -> HTTPS 重定向（仅域名访问时跳转）
server {
    listen 80;
    server_name yinuoai.cloud www.yinuoai.cloud;

    return 301 https://yinuoai.cloud$request_uri;
}

